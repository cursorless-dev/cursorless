languageId: plaintext
command:
  version: 7
  spokenForm: take near and sun
  action:
    name: setSelection
    target:
      type: list
      elements:
        - type: primitive
          mark: {type: decoratedSymbol, symbolColor: default, character: 'n'}
        - type: primitive
          mark: {type: decoratedSymbol, symbolColor: default, character: s}
  usePrePhraseSnapshot: true

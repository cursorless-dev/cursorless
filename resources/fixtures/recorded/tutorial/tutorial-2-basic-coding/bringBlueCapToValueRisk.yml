languageId: python
command:
  version: 7
  spokenForm: bring blue cap to value red
  action:
    name: replaceWithTarget
    source:
      type: primitive
      mark: {type: decoratedSymbol, symbolColor: blue, character: c}
    destination:
      type: primitive
      insertionMode: to
      target:
        type: primitive
        modifiers:
          - type: containingScope
            scopeType: {type: value}
        mark: {type: decoratedSymbol, symbolColor: default, character: r}
  usePrePhraseSnapshot: false
initialState:
  documentContents: |
    def print_color(color, invert=False):
        if invert:
            print(invert_color(color))
        else:
            print(color)


    def invert_color(color):
        if color == "black":
            return "white"
        if color == "white":
            return "black"
        return "black"


    print_color("black")
  selections:
    - anchor: {line: 12, character: 18}
      active: {line: 12, character: 18}

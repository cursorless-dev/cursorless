languageId: typescript
command:
  version: 7
  spokenForm: take content
  action:
    name: setSelection
    target:
      type: primitive
      modifiers:
        - {type: keepContentFilter}
  usePrePhraseSnapshot: false
initialState:
  documentContents: |-
    // Hello

    // world
  selections:
    - anchor: {line: 0, character: 0}
      active: {line: 0, character: 8}
    - anchor: {line: 1, character: 0}
      active: {line: 1, character: 0}
    - anchor: {line: 2, character: 0}
      active: {line: 2, character: 8}
  marks: {}
  hatTokenMap:
    - hatStyle: default
      grapheme: e
      hatRange:
        start: {line: 0, character: 4}
        end: {line: 0, character: 5}
    - hatStyle: default
      grapheme: /
      hatRange:
        start: {line: 0, character: 0}
        end: {line: 0, character: 1}
    - hatStyle: default
      grapheme: r
      hatRange:
        start: {line: 2, character: 5}
        end: {line: 2, character: 6}
    - hatStyle: blue
      grapheme: /
      hatRange:
        start: {line: 2, character: 0}
        end: {line: 2, character: 1}
finalState:
  documentContents: |-
    // Hello

    // world
  selections:
    - anchor: {line: 0, character: 0}
      active: {line: 0, character: 8}
    - anchor: {line: 2, character: 0}
      active: {line: 2, character: 8}
  hatTokenMap:
    - hatStyle: default
      grapheme: e
      hatRange:
        start: {line: 0, character: 4}
        end: {line: 0, character: 5}
    - hatStyle: default
      grapheme: /
      hatRange:
        start: {line: 0, character: 0}
        end: {line: 0, character: 1}
    - hatStyle: default
      grapheme: r
      hatRange:
        start: {line: 2, character: 5}
        end: {line: 2, character: 6}
    - hatStyle: blue
      grapheme: /
      hatRange:
        start: {line: 2, character: 0}
        end: {line: 2, character: 1}

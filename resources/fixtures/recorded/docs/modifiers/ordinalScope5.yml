languageId: typescript
command:
  version: 7
  spokenForm: take first past second item
  action:
    name: setSelection
    target:
      type: primitive
      modifiers:
        - type: range
          anchor:
            type: ordinalScope
            scopeType: {type: collectionItem}
            start: 0
            length: 1
          active:
            type: ordinalScope
            scopeType: {type: collectionItem}
            start: 1
            length: 1
          excludeAnchor: false
          excludeActive: false
  usePrePhraseSnapshot: false
initialState:
  documentContents: "[1, 2, 3]"
  selections:
    - anchor: {line: 0, character: 4}
      active: {line: 0, character: 4}
  marks: {}
finalState:
  documentContents: "[1, 2, 3]"
  selections:
    - anchor: {line: 0, character: 1}
      active: {line: 0, character: 5}

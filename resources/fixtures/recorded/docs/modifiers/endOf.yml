languageId: typescript
command:
  version: 7
  spokenForm: take end of token
  action:
    name: setSelection
    target:
      type: primitive
      modifiers:
        - {type: endOf}
        - type: containingScope
          scopeType: {type: token}
  usePrePhraseSnapshot: false
initialState:
  documentContents: // Hello world
  selections:

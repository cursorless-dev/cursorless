languageId: typescript
command:
  version: 7
  spokenForm: take start of token
  action:
    name: setSelection
    target:
      type: primitive
      modifiers:
        - {type: startOf}
        - type: containingScope
          scopeType: {type: token}
  usePrePhraseSnapshot: false
initialState:
  documentContents: // Hello world
  selections:
    - anchor: {line: 0, character: 6}
      active: {line: 0, character: 6}
  marks: {}
  hatTokenMap:
    - hatStyle: default
      grapheme: e
      hatRange:
        start: {line: 0, character: 4}
        end: {line: 0, character: 5}
    - hatStyle: default
      grapheme: r
      hatRange:
        start: {line: 0, character: 11}
        end: {line: 0, character: 12}
    - hatStyle: default
      grapheme: /
      hatRange:
        start: {line: 0, character: 0}
        end: {line: 0, character: 1}
finalState:
  documentContents: // Hello world
  selections:
    - anchor: {line: 0, character: 3}
      active: {line: 0, character: 3}
  hatTokenMap:
    - hatStyle: default
      grapheme: e
      hatRange:
        start: {line: 0, character: 4}
        end: {line: 0, character: 5}
    - hatStyle: default
      grapheme: /
      hatRange:
        start: {line: 0, character: 0}
        end: {line: 0, character: 1}
    - hatStyle: default
      grapheme: r
      hatRange:
        start: {line: 0, character: 11}
        end: {line: 0, character: 12}

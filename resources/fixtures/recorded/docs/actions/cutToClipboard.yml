languageId: typescript
command:
  version: 7
  spokenForm: carve line
  action:
    name: cutToClipboard
    target:
      type: primitive
      modifiers:
        - type: containingScope
          scopeType: {type: line}
  usePrePhraseSnapshot: false
initialState:
  documentContents: Hello there
  selections:
    - anchor: {line: 0, character: 0}
      active: {line: 0, character: 0}
  marks: {}
finalState:
  documentContents: ""
  selections:
    - anchor: {line: 0, character: 0}
      active: {line: 0, character: 0}
  clipboard: Hello there

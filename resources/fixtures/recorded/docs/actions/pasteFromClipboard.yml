    default.a:
      start: {line: 0, character: 7}
      end: {line: 0, character: 10}
  clipboard: clipboard
finalState:
  documentContents: // bbb clipboard
  selections:
    - anchor: {line: 0, character: 0}
      active: {line: 0, character: 0}

  action:
    name: pasteFromClipboard
    destination:
      type: primitive
      insertionMode: to
      target:
        type: primitive
        mark: {type: decoratedSymbol, symbolColor: default, character: a}
  usePrePhraseSnapshot: false
initialState:
  documentContents: // bbb aaa
  selections:
    - anchor: {line: 0, character: 0}
      active: {line: 0, character: 0}

languageId: python
command:
  version: 7
  spokenForm: post every token funk name skip past token
  action:
    name: setSelectionAfter
    target:
      type: range
      anchor:
        type: primitive
        modifiers:
          - type: everyScope
            scopeType: {type: token}
          - type: containingScope
            scopeType: {type: functionName}
      active:
        type: primitive
        modifiers:
          - type: containingScope
            scopeType: {type: token}
      excludeAnchor: true
      excludeActive: false
  usePrePhraseSnapshot: true
spokenFormError: >-
  connective with id rangeExcludingStart; please see
  https://www.cursorless.org/docs/user/customization for more information
initialState:
  documentContents: |-
    def aaa():
        pass
  selections:
    - anchor: {line: 1, character: 6}
      active: {line: 1, character: 6}
  marks: {}
finalState:
  documentContents: |-
    def aaa():
        pass
  selections:
    - anchor: {line: 0, character: 8}
      active: {line: 0, character: 8}
    - anchor: {line: 0, character: 9}
      active: {line: 0, character: 9}
    - anchor: {line: 0, character: 10}
      active: {line: 0, character: 10}
    - anchor: {line: 1, character: 8}
      active: {line: 1, character: 8}
